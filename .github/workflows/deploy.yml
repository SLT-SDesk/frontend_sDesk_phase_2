name: sDesk Frontend Deploy

on:
  push:
    branches:
      - testing
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies & Build Frontend
        run: |
          npm install
          npm run build
        env:
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT_ID: ${{ secrets.VITE_MICROSOFT_TENANT_ID }}
          VITE_AZURE_CLIENT_SECRET: ${{ secrets.VITE_AZURE_CLIENT_SECRET }}
          AZURE_REDIRECT_URI: ${{ secrets.AZURE_REDIRECT_URI }}

      - name: 🚀 Upload Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          source: "dist/*"
          target: "/home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_tmp/"
          strip_components: 1

      - name: 🔄 Deploy to Nginx & Log Live
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          script: |
            LOG_FILE="/home/${{ secrets.SSH_USERNAME }}/frontend_deployment.log"
            
            echo "" >> $LOG_FILE
            echo "=====================================================================" >> $LOG_FILE
            echo "| 🚀 SDESK FRONTEND DEPLOYMENT STARTED | Time: $(date '+%Y-%m-%d %H:%M:%S') |" >> $LOG_FILE
            echo "=====================================================================" >> $LOG_FILE
            
            {
              echo "[1/3] Preparing deployment directories..."
              sudo rm -rf /var/www/sdesk_new/frontend_sDesk_phase_2/*
              
              echo "[2/3] Moving new frontend files..."
              sudo cp -r ~/sdesk_frontend_tmp/* /var/www/sdesk_new/frontend_sDesk_phase_2/
              
              echo "[3/3] Restarting Nginx Server..."
              sudo systemctl restart nginx
              
              echo "Cleaning up temp files..."
              rm -rf ~/sdesk_frontend_tmp
              
              echo "---------------------------------------------------------------------"
              echo "| ✅ FRONTEND DEPLOYMENT SUCCESS       | Time: $(date '+%Y-%m-%d %H:%M:%S') |"
              echo "====================================================================="
              echo ""
            } >> $LOG_FILE 2>&1
