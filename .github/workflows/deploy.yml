name: sDesk Frontend Deploy

on:
  push:
    branches:
      - testing
  workflow_dispatch:

jobs:
  # Job 1: Code Quality Checks
  Code_Quality_Checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/testing'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Lint Code (Non-Blocking)
        run: npm run lint || echo "Lint issues detected – continuing"
      - name: Type Check (Non-Blocking)
        run: npm run typecheck || echo "TypeScript errors detected – continuing"
      - name: Run Tests
        run: npm run test || echo "No tests configured"
      - name: Security Audit
        run: npm audit --audit-level=high || echo "Security vulnerabilities detected – continuing"

  # Job 2: Build Application
  Build_Application:
    name: Build Application
    runs-on: ubuntu-latest
    needs: Code_Quality_Checks
    if: github.ref == 'refs/heads/testing'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Generate Production .env
        run: |
          echo "VITE_APP_URL=${{ secrets.VITE_APP_URL }}" >> .env
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}" >> .env
          echo "VITE_MICROSOFT_CLIENT_ID=${{ secrets.VITE_MICROSOFT_CLIENT_ID }}" >> .env
          echo "VITE_MICROSOFT_TENANT_ID=${{ secrets.VITE_MICROSOFT_TENANT_ID }}" >> .env
          echo "VITE_AZURE_CLIENT_SECRET=${{ secrets.VITE_AZURE_CLIENT_SECRET }}" >> .env
          echo "AZURE_REDIRECT_URI=${{ secrets.AZURE_REDIRECT_URI }}" >> .env
      - name: Build Frontend
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist

  # Job 3: Upload Build to Server
  Upload_Build:
    name: Upload Build to Server
    runs-on: ubuntu-latest
    needs: Build_Application
    if: github.ref == 'refs/heads/testing'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist
          
      - name: Create Temp Directory on Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          script: mkdir -p /home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_tmp/

      - name: Upload Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          source: "dist/*"
          target: "/home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_tmp/"
          overwrite: true
          strip_components: 1

  # Job 4: Execute Deployment
  Production_Deployment:
    name: Direct Production Deployment
    runs-on: ubuntu-latest
    needs: Upload_Build
    if: github.ref == 'refs/heads/testing'
    steps:
      - name: Execute Deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          script: |
            BASE_DIR="/var/www/sdesk_new/frontend_sDesk_phase_2"
            TMP_SRC="/home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_tmp"

            echo "Deploying new version to: $BASE_DIR"

            sudo rm -rf $BASE_DIR/*
            sudo mkdir -p $BASE_DIR

            sudo cp -r $TMP_SRC/* $BASE_DIR/

            echo "Setting permissions..."
            sudo chown -R nginx:nginx $BASE_DIR

            echo "Restarting Nginx..."
            sudo systemctl restart nginx
            
            echo "Cleaning up temp files..."
            rm -rf $TMP_SRC

            echo "---------------------------------------------------------------------"
            echo "| ✅ FRONTEND DEPLOYMENT SUCCESS       | Time: $(date '+%Y-%m-%d %H:%M:%S') |"
            echo "====================================================================="
