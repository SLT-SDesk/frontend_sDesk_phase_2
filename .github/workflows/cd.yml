name: Deploy SDesk Frontend Phase 2 (Testing)

on:
  # Step 1.1: 
  # Trigger on push to testing branch
  
  push:
    branches:
      - testing

  # Step 1.2: 
  # Trigger workflow when a PR targets testing branch

  pull_request:
    branches:
      - testing

  # Step 1.3: 
  # Allow manual trigger
 
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      
      # STEP 1 — Checkout repository
     
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      
      # STEP 2 — Create .env file using GitHub secrets
      
      # This .env file is added to the uploaded source and then
      # copied into the project folder on the server before build.
     
      - name: 🔐 Generate .env file
        run: |
          echo "VITE_APP_URL=${{ secrets.VITE_APP_URL }}" >> .env
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}" >> .env
          echo "VITE_MICROSOFT_CLIENT_ID=${{ secrets.VITE_MICROSOFT_CLIENT_ID }}" >> .env
          echo "VITE_MICROSOFT_TENANT_ID=${{ secrets.VITE_MICROSOFT_TENANT_ID }}" >> .env
          echo "AZURE_REDIRECT_URI=${{ secrets.AZURE_REDIRECT_URI }}" >> .env
     
      # STEP 3 — Upload SOURCE CODE to server
      
      
      # The server will run npm install + npm run build.
      
      # Uploaded source is stored temporarily at: ~/sdesk_frontend_src_tmp/
      
      # Later on, SSH script replaces the project directory, then performs a fresh build.
     
      - name: 📤 Upload source code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          source: "./"
          target: "/home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_src_tmp/"
          overwrite: true

      
      # STEP 4 — SSH: Clone repo only one and then check the existing code, pull latest changes
      # Replace the source code with the uploaded version, then build on server.

      - name: 🔄 Build & Deploy on Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          script: |
            FRONTEND_PATH="/var/www/sdesk_new/frontend_sDesk_phase_2"
            TMP_SRC="/home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_src_tmp"

            # STEP 4.1 — Clone repo if not exists, else pull latest changes
            echo "Checking if the frontend project directory exists..."
            

            if [ ! -d "$FRONTEND_PATH" ]; then
              echo "Project directory NOT found. Creating & cloning..."
              sudo mkdir -p $FRONTEND_PATH
              sudo git clone https://github.com/SLT-SDesk/frontend_sDesk_phase_2 $FRONTEND_PATH
            else
              echo "Project directory exists — pulling latest Git updates..."
              cd $FRONTEND_PATH
              git config --global --add safe.directory $FRONTEND_PATH
              sudo git pull || true
            fi
            
            
            
            # STEP 4.2 — Replace source code with uploaded version, install dependencies, build

            echo "--------------------------------------------------"
            echo "Fixing permissions for BUILD (give to gayal)..."
            echo "--------------------------------------------------"
            sudo chown -R $USER:$USER /var/www/sdesk_new


            # STEP 4.3 — Replace source code with uploaded version
            echo "--------------------------------------------------"
            echo "Replacing server-side source code with uploaded version..."
            echo "--------------------------------------------------"
            rm -rf $FRONTEND_PATH/*
            cp -r $TMP_SRC/* $FRONTEND_PATH/

            # STEP 4.4 — Copy .env file into project
            echo "--------------------------------------------------"
            echo "Copying .env file into project..."
            echo "--------------------------------------------------"
            cp $TMP_SRC/.env $FRONTEND_PATH/.env

            # STEP 4.5 — Install dependencies & build
            echo "--------------------------------------------------"
            echo "Installing npm dependencies..."
            echo "--------------------------------------------------"
            cd $FRONTEND_PATH
            npm install

            # STEP 4.6 — Build the project
            echo "--------------------------------------------------"
            echo "Building frontend (Vite) on server..."
            echo "--------------------------------------------------"
            npm run build


            # STEP 4.7 — Move built files to NGINX directory
            echo "--------------------------------------------------"
            echo "Fixing permissions for NGINX (give to nginx)..."
            echo "--------------------------------------------------"
            sudo chown -R nginx:nginx /var/www/sdesk_new


            # STEP 4.8 — Copy built files to NGINX directory
            echo "--------------------------------------------------"
            echo "Restarting Nginx..."
            echo "--------------------------------------------------"
            sudo systemctl restart nginx


            # Final Step — Deployment completed message
            echo "--------------------------------------------------"
            echo "Frontend Deployment Completed Successfully! 🎉"
            echo "--------------------------------------------------"