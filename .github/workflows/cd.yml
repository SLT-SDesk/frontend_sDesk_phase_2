name: Deploy SDesk Frontend Phase 2 (Testing)

on:
  push:
    branches:
      - testing
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Upload Source Code to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          source: "."                 # send full project
          target: "/home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_src/"
          rm: true                    # clean old source before copying
          strip_components: 0

      - name: 🛠️ Build & Deploy on Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          script: |
            echo "===== Installing & Building Frontend on Server ====="

            cd ~/sdesk_frontend_src

            echo "Installing dependencies..."
            npm install --legacy-peer-deps

            echo "Building frontend on server..."
            npm run build

            echo "Cleaning old production build..."
            sudo rm -rf /var/www/sdesk_new/frontend_sDesk_phase_2/dist/*

            echo "Copying new dist to production..."
            sudo cp -r dist/* /var/www/sdesk_new/frontend_sDesk_phase_2/dist/

            echo "Fixing permissions..."
            sudo chown -R nginx:nginx /var/www/sdesk_new/frontend_sDesk_phase_2/dist

            echo "Restarting Nginx..."
            sudo systemctl restart nginx

            echo "===== Frontend Deployment Completed Successfully ====="
