name: Frontend CD - Server-Side Build & Deploy (Testing Only)

# Triggers the workflow only on push events to the deployment branches
on:
  push:
    branches:
      - testing
      # - production

jobs:
  # STEP 1: Wait for CI to Pass
  ci_check:
    name: Wait for CI Success
    # FIX: Use the full, robust reference for the reusable workflow.
    uses: ./.github/workflows/ci.yml

  # STEP 2: Deployment
  deployment:
    needs: [ci_check] # Only run if CI check succeeds
    runs-on: ubuntu-latest

    # Define environment variables
    env:
      # NGINX ROOT PATH: Must match the path defined in your sdesk.conf file.
      HOSTING_PATH_TESTING: '/var/www/sdesk_main/Sdesk/frontend/dist'
      #HOSTING_PATH_PRODUCTION: '/var/www/production-app/html'

    steps:
      - name: 🚀 Deploy and Build on Linux Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251 # Using custom port
          script: |
            # --- Setup Variables for Current Run ---
            DEPLOY_BRANCH="${{ github.ref_name }}"
            REPO_URL="https://github.com/${{ github.repository }}"
            REPO_PATH="/tmp/sdesk" # Temporary build location
            FRONTEND_SUBDIR="frontend" # Subdirectory containing package.json

            # Set the final destination path (matches Nginx root)
            HOSTING_PATH="${{ env.HOSTING_PATH_TESTING }}"

            echo "Starting server-side build and deployment for branch $DEPLOY_BRANCH"

            # 1. Check for rsync (must be installed manually on the server)
            if ! command -v rsync &> /dev/null
            then
                echo "ERROR: 'rsync' command not found on the server."
                echo "Please install rsync manually on the SSH host (e.g., 'sudo apt-get install rsync' or 'sudo yum install rsync') and try again."
                exit 1
            fi

            # 2. CRITICAL FIX 2: Clean and Clone the Latest Code
            # This solves the "destination path already exists" error.
            echo "Cleaning up $REPO_PATH and cloning repository..."
            rm -rf "$REPO_PATH"
            mkdir -p "$REPO_PATH"
            git clone $REPO_URL "$REPO_PATH"

            # Navigate to the root of the cloned repo
            cd "$REPO_PATH"
            git fetch origin
            git checkout "$DEPLOY_BRANCH"
            git reset --hard origin/"$DEPLOY_BRANCH"

            # 3. CRITICAL FIX 3: Navigate to the correct subdirectory for NPM commands
            # This solves the "Could not read package.json" error.
            echo "Navigating to frontend subdirectory: $REPO_PATH/$FRONTEND_SUBDIR"
            cd "$REPO_PATH/$FRONTEND_SUBDIR"

            # 4. Install Dependencies and Build
            echo "Installing dependencies and running build..."
            npm ci
            npm run build

            # 5. Deploy the Build Artifact (Atomic Update)
            BUILD_OUTPUT_DIR="./dist"

            echo "Deploying built files from $REPO_PATH/$FRONTEND_SUBDIR/dist to $HOSTING_PATH"

            rsync -av --delete --exclude 'node_modules' "$BUILD_OUTPUT_DIR/" "$HOSTING_PATH/"

            echo "Deployment successful. Files updated in $HOSTING_PATH"

      - name: 🎉 Deployment Complete
        run: echo "Deployment of ${{ github.ref_name }} branch to Linux server finished."
