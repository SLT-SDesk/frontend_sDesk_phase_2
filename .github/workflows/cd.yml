name: Deploy SDesk Frontend Phase 2 (Testing)

on:
  # ---------------------------------------------------------
  # Trigger on push to testing branch
  # ---------------------------------------------------------
  push:
    branches:
      - testing

  # ---------------------------------------------------------
  # Trigger workflow when a PR targets testing branch
  # ---------------------------------------------------------
  pull_request:
    branches:
      - testing

  # ---------------------------------------------------------
  # Allow manual trigger
  # ---------------------------------------------------------
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # STEP 1 — Checkout repository
      # ---------------------------------------------------------
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # STEP 2 — Create .env file using GitHub secrets
      # ---------------------------------------------------------
      # This .env file is added to the uploaded source and then
      # copied into the project folder on the server before build.
      # ---------------------------------------------------------
      - name: 🔐 Generate .env file
        run: |
          echo "VITE_APP_URL=${{ secrets.VITE_APP_URL }}" >> .env
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}" >> .env
          echo "VITE_MICROSOFT_CLIENT_ID=${{ secrets.VITE_MICROSOFT_CLIENT_ID }}" >> .env
          echo "VITE_MICROSOFT_TENANT_ID=${{ secrets.VITE_MICROSOFT_TENANT_ID }}" >> .env
          echo "AZURE_REDIRECT_URI=${{ secrets.AZURE_REDIRECT_URI }}" >> .env

      # ---------------------------------------------------------
      # STEP 3 — Upload SOURCE CODE to server
      # ---------------------------------------------------------
      # NOTE: We are NOT uploading dist/ anymore.
      # The server will run npm install + npm run build.
      #
      # Uploaded source is stored temporarily at:
      #   ~/sdesk_frontend_src_tmp/
      #
      # Later on, SSH script replaces the project directory,
      # then performs a fresh build.
      # ---------------------------------------------------------
      - name: 📤 Upload source code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          source: "./"
          target: "/home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_src_tmp/"
          overwrite: true

      # ---------------------------------------------------------
      # STEP 4 — SSH: Clone repo (first-time) → Pull updates
      # Replace source → Install deps → Build → Restart Nginx
      # ---------------------------------------------------------
      - name: 🔄 Build & Deploy on Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          script: |
            FRONTEND_PATH="/var/www/sdesk_new/frontend_sDesk_phase_2"   #update 6/12/2025 13.35 Fix syntax error("), 13.43 Changed from /var/www/sdesk_new/frontend_sDesk_phase_2/ to /var/www/sdesk_new/frontend_sDesk_phase_2
            TMP_SRC="/home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_src_tmp"

            echo "--------------------------------------------------"
            echo "Checking if the frontend project directory exists..."
            echo "--------------------------------------------------"

            # -----------------------------------------------------
            # ONE-TIME SETUP:
            # If the folder does not exist, clone the full Git repo.
            # After the first deployment, this block does not run.
            # -----------------------------------------------------
            if [ ! -d "$FRONTEND_PATH" ]; then
              echo "Project directory NOT found. Creating & cloning..."
              sudo mkdir -p /var/www/sdesk_new/frontend_sDesk_phase_2
              sudo git clone https://github.com/${{ github.repository }} $FRONTEND_PATH
              sudo chown -R nginx:nginx /var/www/sdesk_new
            else
              echo "Project directory exists — pulling latest Git updates..."
              cd $FRONTEND_PATH
              sudo git pull || true   # Prevent pipeline crash if repo not initialized
            fi

            echo "--------------------------------------------------"
            echo "Replacing server-side source code with uploaded version..."
            echo "--------------------------------------------------"

            # Clean existing source
            sudo rm -rf $FRONTEND_PATH/*

            # Copy uploaded files into project folder
            sudo cp -r $TMP_SRC/* $FRONTEND_PATH/

            echo "--------------------------------------------------"
            echo "Copying .env file into project..."
            echo "--------------------------------------------------"
            sudo cp $TMP_SRC/.env $FRONTEND_PATH/.env       # 6/12/2025 Copy the generated .env file and changed it to sudo permission.

            echo "--------------------------------------------------"
            echo "Installing npm dependencies..."
            echo "--------------------------------------------------"
            cd $FRONTEND_PATH
            npm install

            echo "--------------------------------------------------"
            echo "Building frontend (Vite) on server..."
            echo "--------------------------------------------------"
            npm run build

            echo "--------------------------------------------------"
            echo "Fixing file permissions..."   #6/12/2025 Added this block to fix permission issue.
            echo "--------------------------------------------------"
            sudo chown -R nginx:nginx /var/www/sdesk_new

            echo "--------------------------------------------------"
            echo "Restarting Nginx..."
            echo "--------------------------------------------------"
            sudo systemctl restart nginx

            echo "--------------------------------------------------"
            echo "Frontend Deployment Completed Successfully! 🎉"
            echo "--------------------------------------------------"
