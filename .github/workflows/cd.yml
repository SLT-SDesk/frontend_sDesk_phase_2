name: Deploy SDesk Frontend Phase 2 (Testing)

on:
  push:
    branches:
      - testing
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

     
      # Create frontend .env from GitHub Secrets
      
      - name: 🧪 Generate .env file from secrets
        run: |
         
          echo "VITE_APP_URL=${{ secrets.VITE_APP_URL }}" >> .env
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}" >> .env
          echo "VITE_MICROSOFT_CLIENT_ID=${{ secrets.VITE_MICROSOFT_CLIENT_ID }}" >> .env
          echo "VITE_MICROSOFT_TENANT_ID=${{ secrets.VITE_MICROSOFT_TENANT_ID }}" >> .env
          echo "AZURE_REDIRECT_URI=${{ secrets.AZURE_REDIRECT_URI }}" >> .env

      # ---------------------------------------------------------
      # Build the frontend
      # ---------------------------------------------------------
      - name: ⚙️ Build SDesk Frontend (Phase 2)
        run: |
          npm install
          npm run build

      
      # Upload only frontend dist folder
      
      - name: 🚀 Upload Dist to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}          # 124.43.216.136
          username: ${{ secrets.SSH_USERNAME }}  # gayal
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          source: "dist/"       #update:2/12/2025 - changed from frontend_phase_2 to /dist/*
          target: "/home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_tmp/"

      - name: 📝 List dist files
        run: ls -R dist      #update 12/2/2025 - changed from ls -R frontend_sDesk_phase_2/dist to ls -R dist

     
      # SSH → Replace production dist safely
      
      - name: 🔄 Deploy & Restart Nginx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          script: |
            echo "Starting SDesk Frontend Deployment..."

            mkdir -p ~/sdesk_frontend_tmp

            echo "Removing old frontend build..."
            sudo rm -rf /var/www/sdesk_new/frontend_sDesk_phase_2/dist/*

            echo "Copying new build..."
            sudo cp -r ~/sdesk_frontend_tmp/* /var/www/sdesk_new/frontend_sDesk_phase_2/dist/

            echo "Fixing permissions..."
            sudo chown -R nginx:nginx /var/www/sdesk_new/frontend_sDesk_phase_2/dist

            echo "Restarting Nginx..."
            sudo systemctl restart nginx

            echo "Frontend Deployment Completed Successfully."
