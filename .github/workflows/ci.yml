name: Frontend CI - Lint & Build Checks

# FIXED: Using 'workflow_call' makes this workflow reusable for the CD pipeline.
on:
  workflow_call:
    # No inputs or outputs needed for this simple gating check.

jobs:
  build_and_validate:
    name: Build and Validate Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🛠️ Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧹 Run ESLint / Code Quality Checks
        run: npm run lint
        
      # Unit test step remains commented out as requested.
      # - name: 🧪 Run Unit/Component Tests
      #   run: npm test

      - name: 🏗️ Run Production Build Check
        run: npm run build
        
      - name: ✅ CI Completed
        run: echo "Frontend CI checks (Linting & Build) passed successfully."