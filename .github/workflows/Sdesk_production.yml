name: SDesk Frontend CI-CD Pipeline

on:
  push:
    branches:
      - testing
  pull_request:
    branches:
      - testing
  workflow_dispatch:

jobs:

  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code (Non-Blocking)
        run: npm run lint || echo "Lint issues detected – continuing"

      - name: Type Check (Non-Blocking)
        run: npm run typecheck || echo "TypeScript errors detected – continuing"

      - name: Run Tests
        run: npm run test || echo "No tests configured"

      - name: Security Audit
        run: npm audit --audit-level=high || echo "Security vulnerabilities detected – continuing"


  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Production .env
        run: |
          echo "VITE_APP_URL=${{ secrets.VITE_APP_URL }}" >> .env
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}" >> .env
          echo "VITE_MICROSOFT_CLIENT_ID=${{ secrets.VITE_MICROSOFT_CLIENT_ID }}" >> .env
          echo "VITE_MICROSOFT_TENANT_ID=${{ secrets.VITE_MICROSOFT_TENANT_ID }}" >> .env
          echo "VITE_AZURE_CLIENT_SECRET=${{ secrets.VITE_AZURE_CLIENT_SECRET }}" >> .env
          echo "AZURE_REDIRECT_URI=${{ secrets.AZURE_REDIRECT_URI }}" >> .env

      - name: Show Generated Env
        run: cat .env


      - name: Build Frontend
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist


  deploy:
    name: Blue-Green Production Deployment
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      - name: Upload Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          source: "dist/*"
          target: "/home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_bluegreen_tmp/"
          overwrite: true

      - name: Execute Blue-Green Deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3251
          script: |
            BASE_DIR="/var/www/sdesk_new"
            ACTIVE_LINK="$BASE_DIR/frontend_sDesk_phase_2"
            BLUE_DIR="$BASE_DIR/frontend_blue"
            GREEN_DIR="$BASE_DIR/frontend_green"
            TMP_SRC="/home/${{ secrets.SSH_USERNAME }}/sdesk_frontend_bluegreen_tmp"

            echo "Detecting current active environment..."

            if [ -L "$ACTIVE_LINK" ]; then
              CURRENT_TARGET=$(readlink -f $ACTIVE_LINK)
            else
              CURRENT_TARGET="$BLUE_DIR"
            fi

            if [ "$CURRENT_TARGET" = "$BLUE_DIR" ]; then
              NEW_TARGET="$GREEN_DIR"
              OLD_TARGET="$BLUE_DIR"
            else
              NEW_TARGET="$BLUE_DIR"
              OLD_TARGET="$GREEN_DIR"
            fi

            echo "Current active: $CURRENT_TARGET"
            echo "Deploying new version to: $NEW_TARGET"

            sudo rm -rf $NEW_TARGET
            sudo mkdir -p $NEW_TARGET

            sudo cp -r $TMP_SRC/* $NEW_TARGET/

            echo "Setting permissions..."
            sudo chown -R nginx:nginx $NEW_TARGET

            echo "Performing atomic switch..."
            sudo ln -sfn $NEW_TARGET $ACTIVE_LINK

            echo "Restarting Nginx..."
            sudo systemctl restart nginx

            echo "Verifying deployment..."

            if systemctl is-active --quiet nginx; then
              echo "Deployment successful."
              echo "Cleaning old environment..."
              sudo rm -rf $OLD_TARGET
            else
              echo "Deployment failed. Rolling back..."

              sudo ln -sfn $OLD_TARGET $ACTIVE_LINK
              sudo systemctl restart nginx

              echo "Rollback completed."
              exit 1
            fi

            echo "Blue-Green Deployment Completed Successfully"
